<style id="appcss">
/* Layout: 米白底、墨綠標題的軍用表單；兩張 A4 比例頁面，右下角常駐「動作速查」抽屜 */
:root{

  --day:#a63a2e; --night:#2f5d3a; --spec:#8a4468;
  --f-display:'Noto Serif TC','Songti TC','PMingLiU',serif;
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-label:'PT Sans Narrow','Arial Narrow','Noto Sans TC',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:20px 64px}
.app{max-width:1000px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* top */
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.brand .ru{font-family:var(--f-label);font-weight:700;letter-spacing:.12em;color:var(--red);font-size:.95rem}
.brand h1{font-family:var(--f-display);font-weight:900;font-size:1.9rem;line-height:1.2}
.sync{font-size:.85rem;padding:4px 12px;border-radius:99px;background:var(--field);border:1px solid var(--line);color:var(--muted);max-width:100%}
.sync.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
.sync.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;background:var(--card);border:1px solid var(--line);padding:10px 12px;border-radius:6px}
.bar label.sel{display:flex;gap:8px;align-items:center;min-width:0}
.bar select{min-width:0;max-width:100%;background:var(--field);border:1px solid var(--line);border-radius:4px;padding:6px 8px}
.bar .grow{flex:1 1 20px}
.btn{position:relative;background:var(--field);border:1px solid var(--line);padding:6px 12px;border-radius:4px;cursor:pointer;font-size:.9rem;white-space:nowrap}

.btn.primary{background:var(--btn);color:var(--btnink);border-color:transparent;font-weight:700}
.btn.danger{color:var(--red)}
.btn[disabled]{opacity:.45;cursor:default}
.filebtn{display:none}
.rowgrp{display:contents}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.chooser{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.chooser h2{font-family:var(--f-display);font-size:1.3rem;margin-bottom:4px}
.chooser .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px;margin-top:12px}
.pcard{text-align:left;background:var(--field);border:1px solid var(--line);border-left:6px solid var(--green);border-radius:4px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.pcard:hover{border-color:var(--green)}
.pcard b{font-family:var(--f-display);font-size:1.5rem;color:var(--green);line-height:1.2}
.pcard span{font-size:.85rem;color:var(--muted)}

/* sheet */
fieldset.sheet{border:0;padding:0;margin:0;min-width:0;display:flex;flex-direction:column;gap:20px}
.page{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:28px 30px;display:flex;flex-direction:column;gap:22px;min-width:0}

.hint{font-size:.85rem;color:var(--muted)}

.p1-top{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:24px}

.p1-mid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px}

.attrs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.abox{border:3px solid var(--green);min-height:104px;padding:6px 8px;display:flex;flex-direction:column;justify-content:space-between;gap:4px;min-width:0}

.stepper{display:flex;align-items:center;justify-content:center;gap:8px}
.stepper output,.abox output.big{font-family:var(--f-display);font-weight:900;font-size:2.1rem;min-width:2.6ch;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
.step{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--field);cursor:pointer;line-height:1;font-size:1.05rem;padding:0}

.rules{font-size:.85rem;color:var(--muted);line-height:1.5}
.note{font-size:.83rem;padding:4px 10px;border-radius:4px}
.note.ok{background:var(--okbg);color:var(--ok)}
.note.warn{background:var(--warnbg);color:var(--warn)}
.counters{display:flex;flex-direction:column;gap:8px}
.counter{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700}

.p1-bot{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:26px}
.cares{display:flex;flex-direction:column;gap:8px}
.care{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}

.braces{display:flex;gap:10px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}

.staff{display:flex;flex-direction:column;gap:2px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px;font-size:.9rem;max-width:calc(100% - 32px);z-index:20;box-shadow:0 4px 18px rgba(0,0,0,.3)}

.modal textarea{width:100%;height:220px;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px;font-family:ui-monospace,monospace;font-size:.8rem}
.empty{color:var(--muted);padding:20px;text-align:center}

}

/* move links + reference drawer */

/* ================= 小工具 ================= */
const $=(s,r)=>(r||document).querySelector(s);
function h(tag,props,...kids){
  const e=document.createElement(tag);
  if(props)for(const k in props){const v=props[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k==='text')e.textContent=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(k==='checked'||k==='disabled'||k==='value'||k==='hidden')e[k]=v;
    else e.setAttribute(k,v===true?'':v);}
  for(const kid of kids.flat(Infinity)){if(kid==null||kid===false)continue;e.append(kid.nodeType?kid:document.createTextNode(kid));}
  return e;
}
function rich(text){
  const m=/^(【[^】]+】)(.*)$/.exec(text);
  return m?[h('b',{text:m[1]}),linkify(m[2])]:linkify(text);
}
function fmt(n){return n>0?'+'+n:String(n)}
function rid(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
let toastT=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},3200)}

function newChar(pb){
  const P=PB[pb];
  return {id:rid(),pb:pb,name:'',player:'',rank:'中士',looks:{},
    moves:P.moves.map(()=>false),otherMove:false,otherMoveText:'',role:-1,
    attrs:{skill:0,luck:0,guts:0},points:{tally:0,eda:0},
    cares:Array.from({length:P.cares},()=>({feel:'',target:''})),
    trauma:[false,false,false,false],medals:{},honors:{},platoon:'',unit:'',leader:'',
    adv:{lesson:0,bond:0,growth:0,honor:0,duty:0,west:0},
    marks:Array(12).fill(false),updated:Date.now()};
}
function normalize(c){
  if(!c||!PB[c.pb])return null;
  const b=newChar(c.pb);
  const o=Object.assign(b,c);
  o.attrs=Object.assign(b.attrs,c.attrs||{});
  o.points=Object.assign(b.points,c.points||{});
  o.adv=Object.assign(b.adv,c.adv||{});
  o.looks=Object.assign({},c.looks||{});
  o.medals=Object.assign({},c.medals||{});
  o.honors=Object.assign({},c.honors||{});
  const fit=(arr,len,def)=>{const a=Array.isArray(arr)?arr.slice(0,len):[];while(a.length<len)a.push(def());return a};
  o.moves=fit(c.moves,PB[c.pb].moves.length,()=>false);
  o.marks=fit(c.marks,12,()=>false);
  o.trauma=fit(c.trauma,4,()=>false);
  o.cares=Array.isArray(c.cares)&&c.cares.length?c.cares.map(x=>({feel:String(x&&x.feel||''),target:String(x&&x.target||'')})):b.cares;
  if(!RANKS.includes(o.rank))o.rank='中士';
  if(typeof o.id!=='string'||!o.id)o.id=rid();
  o.updated=Number(o.updated)||Date.now();
  return o;
}

function modal(title,text,opts){
  opts=opts||{};
  const host=$('#modalHost');host.textContent='';
  const ta=h('textarea',{id:'modalTa',readonly:!!opts.readonly,placeholder:opts.placeholder||''});ta.value=text||'';
  const close=()=>{host.textContent=''};
  const acts=[];
  if(opts.readonly)acts.push(h('button',{type:'button',class:'btn primary',onclick:()=>{ta.select();try{navigator.clipboard.writeText(ta.value).then(()=>toast('已複製'),()=>toast('請按 Ctrl/⌘+C 複製'))}catch(e){toast('請按 Ctrl/⌘+C 複製')}}},'複製'));
  if(opts.onSubmit)acts.push(h('button',{type:'button',class:'btn primary',onclick:()=>{if(opts.onSubmit(ta.value)!==false)close()}},opts.submitLabel||'確定'));
  acts.push(h('button',{type:'button',class:'btn',onclick:close},'關閉'));
  host.append(h('div',{class:'modal',onclick:e=>{if(e.target.classList.contains('modal'))close()}},
    h('div',{class:'box',role:'dialog','aria-label':title},h('b',{text:title}),opts.note?h('p',{class:'hint',text:opts.note}):null,ta,h('div',{class:'row'},acts))));
  ta.focus();if(opts.readonly)ta.select();
}
async function saveFile(filename,content,mime){
  try{
    const url=URL.createObjectURL(new Blob([content],{type:mime||'application/octet-stream'}));
    const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    return 'ok';
  }catch(e){return 'fail'}
}
async function exportJson(){
  const c=data.chars[data.current];if(!c||viewing)return;
  const text=JSON.stringify({app:'nw-sheet',v:1,char:c},null,1);
  const r=await saveFile((c.name||PB[c.pb].zh)+'-夜襲魔女角色卡.json',text,'application/json');
  if(r==='ok')toast('已儲存角色卡檔案。下次用「讀取角色卡」開啟它。');
  else if(r!=='declined')modal('角色卡資料',text,{readonly:true,note:'這個環境無法直接下載檔案。請複製下面的文字，貼到記事本並存成 .json 檔；之後用「貼上文字讀取」就能還原。'});
}
function importFromText(text){
  try{
    const j=JSON.parse(String(text));
    const c=normalize(j&&j.char?j.char:j);
    if(!c)throw new Error('bad');
    c.id=rid();c.updated=Date.now();
    data.chars[c.id]=c;data.current=c.id;showChooser=false;confirmDel=false;saveLocal();refreshAll();
    toast('已讀取「'+(c.name||'未命名')+'」');
    return true;
  }catch(err){toast('這不是夜襲魔女角色卡的資料，請確認檔案或貼上的文字完整。');return false}
}
function importJson(e){
  const f=e.target.files&&e.target.files[0];e.target.value='';
  if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>importFromText(rd.result);
  rd.onerror=()=>toast('讀取檔案失敗。');
  rd.readAsText(f);
}

async function exportPrint(){
  const c=data.chars[data.current];if(!c||viewing)return;
  const live=[...$('#sheetWrap').querySelectorAll('input,select')];
  const clone=$('#sheetWrap').cloneNode(true);
  const dst=[...clone.querySelectorAll('input,select')];
  live.forEach((s,i)=>{
    const d=dst[i];if(!d)return;
    if(s.type==='checkbox'||s.type==='radio'){if(s.checked)d.setAttribute('checked','');else d.removeAttribute('checked');d.setAttribute('disabled','');}

const MOVE_BY_NAME={};

const moveUI={group:'day',expanded:{}};

  return h('span',{class:'mv',role:'button',tabindex:'0',title:'查看動作：'+name,onclick:go,onkeydown:e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}},'【'+name+'】');

function linkify(text){
  const out=[];
  String(text).split(/(【[^】]+】)/).forEach(p=>{
    const m=/^【([^】]+)】$/.exec(p);
    if(m&&MOVE_BY_NAME[m[1]])out.push(mvLink(m[1]));else if(p)out.push(p);

}

/* 設定放在另一個小檔 firebase-config.js；沒有設定時，整個房間功能不會出現。 */
const FB_VER='10.12.2';
const room={joined:false,busy:false,connected:false,code:'',name:'',role:'player',pid:'',peers:{},ghosts:{},prev:{},refs:null,timer:null,lastSent:'',msg:'',form:{code:'',name:'',role:'player'}};
const peerCache={};
function fbCfg(){const c=window.NW_FIREBASE_CONFIG;return c&&typeof c.databaseURL==='string'&&/^https:\/\//.test(c.databaseURL)?c:null}
function roomAvailable(){return !!fbCfg()}
function gate(){return roomAvailable()&&!room.joined}
function ownChar(){return data.chars[data.current]||null}
function getPid(){
  let p='';try{p=sessionStorage.getItem('nw-pid')||''}catch(e){}
  if(!p){p='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);try{sessionStorage.setItem('nw-pid',p)}catch(e){}}
  return p;
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load '+src));document.head.appendChild(s)})}
async function ensureFirebase(){
  if(window.firebase&&window.firebase.database)return window.firebase;
  const base='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
  await loadScript(base+'firebase-app-compat.js');
  await loadScript(base+'firebase-database-compat.js');
  return window.firebase;
}
function peerChar(str){
  if(!str)return null;
  if(peerCache.s!==str){peerCache.s=str;try{peerCache.c=normalize(JSON.parse(str))}catch(e){peerCache.c=null}}
  return peerCache.c;
}
function genCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=A[Math.floor(Math.random()*A.length)];return s}

async function joinRoom(code,name,role){
  code=String(code||'').trim().toUpperCase();
  if(!/^[A-Z0-9]{4,8}$/.test(code)){room.msg='房間代碼請用 4 到 8 個英文字母或數字。';renderRoom();return}
  name=String(name||'').trim().slice(0,20);
  if(!name){room.msg='請輸入顯示名稱。';renderRoom();return}
  room.busy=true;room.msg='連線中…';renderRoom();
  try{
    const fb=await ensureFirebase();
    if(!(fb.apps&&fb.apps.length))fb.initializeApp(fbCfg());
    const db=fb.database();
    room.pid=getPid();room.code=code;room.name=name;room.role=role==='gm'?'gm':'player';
    const players=db.ref('rooms/'+code+'/players');
    const me=players.child(room.pid);
    const conn=db.ref('.info/connected');
    room.refs={players:players,me:me,conn:conn,pcb:null,ccb:null};
    room.refs.ccb=conn.on('value',snap=>{
      room.connected=snap.val()===true;
      if(room.connected){
        me.onDisconnect().remove().then(()=>pushMe(true)).catch(()=>{room.msg='無法寫入房間，請檢查 Firebase 規則。';renderRoom()});
      }
      renderRoom();
    });
    room.refs.pcb=players.on('value',snap=>{room.peers=snap.val()||{};onPeers()},err=>{room.msg='無法讀取房間，請檢查 Firebase 規則。';renderRoom()});
    room.joined=true;room.busy=false;room.msg='';side.open=false;side.view=(room.role==='player'&&!Object.keys(data.chars).length)?'manage':'players';room.lastSent='';room.ghosts={};room.prev={};
    try{sessionStorage.setItem('nw-room',JSON.stringify({code:code,name:name,role:room.role}))}catch(e){}
    refreshAll();
  }catch(e){
    room.busy=false;room.joined=false;room.refs=null;
    room.msg='無法連線。請確認網路，以及 firebase-config.js 的設定。';
    renderRoom();
  }
}
function myPayload(){
  const o={name:room.name,role:room.role,t:Date.now()};
  const c=room.role==='player'?ownChar():null;
  if(c)o.card=JSON.stringify(c);
  if(Object.keys(room.ghosts).length)o.ghosts=room.ghosts;
  return o;
}
async function pushMe(force){
  if(!room.joined||!room.refs)return;
  const o=myPayload();
  const sig=(o.card||'')+'|'+o.name+'|'+o.role+'|'+Object.keys(room.ghosts).sort().map(k=>k+':'+room.ghosts[k].t).join(',');
  if(!force&&sig===room.lastSent)return;
  room.lastSent=sig;
  try{await room.refs.me.set(o)}catch(e){room.lastSent='';room.msg='寫入房間失敗，請檢查 Firebase 規則。';renderRoom()}
}
function scheduleRoom(){if(!room.joined)return;clearTimeout(room.timer);room.timer=setTimeout(()=>pushMe(false),500)}
async function leaveRoom(){
  const r=room.refs;
  clearTimeout(room.timer);
  room.refs=null;room.joined=false;side.view=null;side.open=false;room.peers={};room.ghosts={};room.prev={};room.connected=false;room.msg='';room.lastSent='';viewing=null;viewSig='';
  try{sessionStorage.removeItem('nw-room')}catch(e){}
  refreshAll();
  if(r){
    try{r.players.off('value',r.pcb);r.conn.off('value',r.ccb)}catch(e){}
    try{await r.me.onDisconnect().cancel()}catch(e){}
    try{await r.me.remove()}catch(e){}
  }
}
function entryOf(pid){return room.peers[pid]||room.ghosts[pid]||null}
function sameWho(a,b){return a.role===b.role&&String(a.name).trim().toLowerCase()===String(b.name).trim().toLowerCase()}
/* 有人離開時，在線的每個人都把他的角色卡複製一份存在自己的資料底下。
   每個人的資料都設定了「斷線就刪除」，所以最後一個人離開時，所有資料會一起消失。 */
function updateGhosts(){
  const live=room.peers||{};
  const g=Object.assign({},room.ghosts);
  for(const pid in room.prev){
    if(pid===room.pid||live[pid])continue;
    const p=room.prev[pid];
    if(p&&p.card)g[pid]={name:p.name,role:p.role,t:p.t||0,card:p.card};
  }
  for(const pid in live){
    const gs=live[pid]&&live[pid].ghosts;
    if(!gs)continue;
    for(const gp in gs){
      const x=gs[gp];
      if(!x||!x.card)continue;
      if(!g[gp]||(x.t||0)>(g[gp].t||0))g[gp]={name:x.name,role:x.role,t:x.t||0,card:x.card};
    }
  }
  const liveList=Object.keys(live).map(k=>live[k]);
  Object.keys(g).forEach(gp=>{if(live[gp]||liveList.some(l=>sameWho(l,g[gp])))delete g[gp]});
  Object.keys(g).sort((a,b)=>(g[b].t||0)-(g[a].t||0)).slice(12).forEach(k=>delete g[k]);
  room.ghosts=g;
  room.prev={};
  for(const pid in live)room.prev[pid]={name:live[pid].name,role:live[pid].role,t:live[pid].t,card:live[pid].card};
}
function tabIds(){
  const out=[];
  const live=room.peers||{};
  const players=Object.keys(live).filter(k=>live[k].role!=='gm'&&k!==room.pid)
    .sort((x,y)=>String(live[x].name).localeCompare(String(live[y].name),'zh-Hant'));
  if(room.role==='player')out.push(room.pid);
  players.forEach(k=>out.push(k));
  Object.keys(room.ghosts).filter(k=>room.ghosts[k].card&&!live[k])
    .sort((x,y)=>(room.ghosts[y].t||0)-(room.ghosts[x].t||0)).forEach(k=>out.push(k));
  return out;
}
function ensureView(){
  if(!(room.joined&&room.role==='gm'))return false;
  const t=tabIds();
  if(viewing&&t.includes(viewing))return false;
  const n=t[0]||null;
  if(n===viewing)return false;
  viewing=n;viewSig=n?((entryOf(n)||{}).card||''):'';
  return true;
}
function onPeers(){
  updateGhosts();
  scheduleRoom();
  if(ensureView()){refreshAll();return}
  renderRoom();
  if(viewing){
    const p=entryOf(viewing);
    if(!p){viewing=null;viewSig='';refreshAll();return}
    const sig=p.card||'';
    if(sig!==viewSig){viewSig=sig;renderSheet()}
    renderViewing();
  }
}
function viewPeer(pid){
  const p=entryOf(pid);
  if(!p)return;
  viewing=pid;viewSig=p.card||'';confirmDel=false;showChooser=false;
  refreshAll();
}
function backToMine(){viewing=null;viewSig='';refreshAll()}
